spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Khi mới dựng bảng lần đầu có thể để update, ổn định rồi nên chuyển sang validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Giới hạn thời gian sống tối đa của 1 connection trong pool (ví dụ 4 phút = 240000 ms)
spring.datasource.hikari.max-lifetime=240000
# Gửi ping giữ kết nối định kỳ (ví dụ mỗi 60 giây = 60000 ms)
spring.datasource.hikari.keepalive-time=60000
# Thời gian chờ tối đa khi lấy connection từ pool (30 giây)
spring.datasource.hikari.connection-timeout=30000